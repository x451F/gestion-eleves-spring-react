services:
  postgres:
    image: postgres:15-alpine
    container_name: gestion-eleves-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gestion_eleves}
      POSTGRES_USER: ${POSTGRES_USER:-gestion_eleves}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestion_eleves_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gestion_eleves} -d ${POSTGRES_DB:-gestion_eleves}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  postgres_data:
