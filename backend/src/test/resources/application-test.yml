spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  cors:
    allowed-origins:
      - http://localhost:5173
  security:
    jwt:
      issuer: gestion-eleves-api-test
      # Deterministic 32-byte key used only by the test profile.
      secret-base64: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
    refresh-cookie:
      secure: false
  storage:
    photo-root: ${java.io.tmpdir}/gestion-eleves-test-photos
    max-photo-size: 5242880

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
