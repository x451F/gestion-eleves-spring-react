spring:
  application:
    name: gestion-eleves-api
  config:
    import: "optional:configtree:${APP_SECRET_CONFIGTREE_PATH:/run/secrets/}"
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gestion_eleves}
    username: ${DB_USERNAME:gestion_eleves}
    password: ${DB_PASSWORD:gestion_eleves_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_PHOTO_SIZE:5MB}
      max-request-size: ${MAX_PHOTO_SIZE:5MB}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins:
      - ${FRONTEND_ORIGIN:http://localhost:5173}
  storage:
    photo-root: ${UPLOAD_DIR:uploads/eleves}
    max-photo-size: ${MAX_PHOTO_SIZE_BYTES:5242880}
  security:
    jwt:
      issuer: ${APP_SECURITY_JWT_ISSUER:gestion-eleves-api}
      # Base64 of at least 32 cryptographically random bytes; provide through configtree or this environment property.
      secret-base64: ${APP_SECURITY_JWT_SECRET_BASE64:}
      access-token-lifetime: 15m
    refresh-cookie:
      name: refresh_token
      path: /api/auth
      lifetime: 7d
      secure: true
      same-site: Strict
  mail:
    sender: ${MAIL_SENDER:no-reply@gestion-eleves.local}
    activation-url: ${APP_MAIL_ACTIVATION_URL:http://localhost:5173/activation}
    reset-url: ${APP_MAIL_RESET_URL:http://localhost:5173/reinitialisation-mot-de-passe}

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
    org.hibernate.orm.jdbc.bind: ${SQL_BIND_LOG_LEVEL:WARN}
